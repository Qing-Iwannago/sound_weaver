server:
  port: ${PORT:8080}

spring:
  application:
    name: music-agent
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

ai:
  dashscope:
    api-key: ${AI_DASHSCOPE_API_KEY}
    model: glm-4-flash-250414
    base-url: https://open.bigmodel.cn/api/paas/v4/
